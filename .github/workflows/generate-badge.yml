name: Generate Certificates Badge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download badge SVG
        run: |
          curl -s "https://shields.io" -o certificates-badge.svg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add certificates-badge.svg
          git commit -m "chore: сгенерировать локальный бейдж сертификатов" || exit 0
          git push
